<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة من علي إلى اموشاتي ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.8s ease;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            position: relative;
        }

        /* المطر المتساقط (القلوب والستيكرات) */
        .rain-item {
            position: absolute;
            top: -50px;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* البطاقة الرئيسية */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            min-height: 520px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 30px 25px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .sticker-box {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            animation: bounce 3s ease-in-out infinite;
        }

        .sticker-box img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 24px;
            font-weight: 900;
            color: #2b2b2b;
            margin-bottom: 12px;
        }

        .message {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            font-weight: 700;
            margin-bottom: 20px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* الأزرار والتنقل */
        .nav-buttons {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #d63384;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: #fff0f5;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .indicator {
            font-size: 13px;
            color: #555;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card-container" id="card">
        <div class="sticker-box">
            <img id="sticker" src="" alt="ستيكر بناتي">
        </div>

        <div>
            <h2 class="title" id="title">العنوان</h2>
            <p class="message" id="message">المحتوى...</p>
        </div>

        <div style="width: 100%;">
            <div class="nav-buttons">
                <button id="prevBtn" onclick="prev()">السابق 👈</button>
                <button id="nextBtn" onclick="next()">التالي 👉</button>
            </div>
            <div class="indicator" id="indicator">1 / 5</div>
        </div>
    </div>

    <script>
        // قصة الرسائل والصفحات
        const story = [
            {
                bg: "linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)",
                sticker: "https://api.iconify.design/fluent-emoji:sparkling-heart.svg",
                title: "إلى أميرة قلبي اموشاتي 💕",
                text: "هذا الموقع الصغير سويته الج خصيصاً حتى أذكرج شكد إنتي مميزة وغالية بقلبي.. من علي إلى ألطف بنوتة ✨",
                rain: "💖"
            },
            {
                bg: "linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)",
                sticker: "https://api.iconify.design/fluent-emoji:girl-light.svg",
                title: "ضحكتج الحلوة 🌸",
                text: "تدرين يا اموشاتي إنو ضحكتج هي أحلى شيء بالدنيا؟ لما تبتسمين تجين الدفء والجمال لكل أيامي 💕",
                rain: "🌸"
            },
            {
                bg: "linear-gradient(135deg, #ffbcd9 0%, #fbe0e0 100%)",
                sticker: "https://api.iconify.design/fluent-emoji:princess-light.svg",
                title: "مكانج بقلبي 👑",
                text: "إنتي مو بس حبيبتي، إنتي ملجأي والشيء الحلو الوحيد الي ينور حياتي.. ربي يديمج لي يا أحلى نعمة ✨",
                rain: "✨"
            },
            {
                bg: "linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)",
                sticker: "https://api.iconify.design/fluent-emoji:growing-heart.svg",
                title: "وعد علي 💌",
                text: "أوعدج أظل دائماً بجانبج، أسندج وأحبج أكثر بكل يوم يمر علينا.. حب علي لاموشاتي ما ينتهي 🌱",
                rain: "💚"
            },
            {
                bg: "linear-gradient(135deg, #f6d365 0%, #fda085 100%)",
                sticker: "https://api.iconify.design/fluent-emoji:red-heart.svg",
                title: "احبج هواي ❤️",
                text: "شكراً لأنكِ بفي حياتي، وشكراً على كل فرحة تصنعيها بوجودج اللطيف.. يروح علي فدوة لاموشاتي! 💍✨",
                rain: "❤️"
            }
        ];

        let cur = 0;

        function build() {
            const data = story[cur];
            document.body.style.background = data.bg;
            document.getElementById('sticker').src = data.sticker;
            document.getElementById('title').innerText = data.title;
            document.getElementById('message').innerText = data.text;
            document.getElementById('indicator').innerText = `${cur + 1} / ${story.length}`;

            document.getElementById('prevBtn').disabled = (cur === 0);
            document.getElementById('nextBtn').disabled = (cur === story.length - 1);
        }

        function next() {
            if (cur < story.length - 1) {
                cur++;
                build();
            }
        }

        function prev() {
            if (cur > 0) {
                cur--;
                build();
            }
        }

        // دالة المطر المتساقط مثل الكود الخاص بك
        function spawnRain() {
            const r = document.createElement('div');
            r.className = 'rain-item';
            r.innerHTML = story[cur].rain;
            r.style.left = Math.random() * 100 + 'vw';
            r.style.fontSize = Math.random() * 20 + 25 + 'px';
            r.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(r);
            setTimeout(() => r.remove(), 5000);
        }

        setInterval(spawnRain, 400);
        build();
    </script>
</body>
</html>
