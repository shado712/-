<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلى اموشاتي ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0d0a14;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      color: #fff;
      position: relative;
      padding: 20px;
    }

    /* خلفية ضوئية ناعمة متحركة */
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 105, 180, 0.18) 0%, rgba(13, 10, 20, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(60px);
      z-index: 1;
      transition: background 1s ease;
    }

    /* مطر الستيكرات المتساقط من أعلى الشاشة */
    .falling-sticker {
      position: absolute;
      top: -60px;
      pointer-events: none;
      z-index: 2;
      animation: fallDown linear forwards;
    }

    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* حاوي النص الحر (بدون حدود أو بطاقة) */
    .text-container {
      position: relative;
      z-index: 10;
      max-width: 500px;
      width: 100%;
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInText 0.8s ease-in-out;
    }

    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 32px;
      color: #f7d6e0;
      margin-bottom: 25px;
      text-shadow: 0 4px 15px rgba(247, 214, 224, 0.3);
    }

    .message {
      font-size: 19px;
      line-height: 2.1;
      color: #eaeaea;
      font-weight: 400;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      padding: 0 10px;
    }

    /* زر الانتقال على شكل ستيكر كبيـر تفاعلي */
    .sticker-btn-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .sticker-btn-wrapper:hover {
      transform: scale(1.1);
    }

    .sticker-btn-wrapper:active {
      transform: scale(0.95);
    }

    .sticker-btn {
      font-size: 65px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
      animation: pulseSticker 2s infinite ease-in-out;
    }

    @keyframes pulseSticker {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .btn-hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .progress-dots {
      position: absolute;
      bottom: 25px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #ff7eb3;
      width: 18px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="bg-glow" id="glow"></div>

  <!-- النصوص الحرة بدون إطار -->
  <div class="text-container" id="textBlock">
    <h1 class="title" id="title">عنوان الصفحة</h1>
    <p class="message" id="message">محتوى الرسالة...</p>
  </div>

  <!-- الزر الوحيد المكون من ستيكر متجدد للذهاب فقط -->
  <div class="sticker-btn-wrapper" id="nextStickerBtn" onclick="nextPage()">
    <div class="sticker-btn" id="btnSticker">🥀</div>
    <span class="btn-hint" id="btnHint">اضغط للانتقال ✨</span>
  </div>

  <!-- مؤشر النقاط لعدد الصفحات -->
  <div class="progress-dots" id="dotsContainer"></div>

  <script>
    // 10 صفحات بنصوص راقية وستيكرات مختلفة لكل صفحة
    const pages = [
      {
        title: "إلى اموشاتي.. ❤️",
        message: "لم تكوني يوماً حساً عابراً بفي حياتي، بل كنتِ الهدوء والسكينة التي يتسارع قلبي إليها وسط كل هذا العالم المزدحم. هذه السطور كتبتها لكِ بصدق.. من علي.",
        buttonSticker: "🥀",
        rainSticker: ["🥀", "✨", "🤍"],
        glow: "radial-gradient(circle, rgba(255, 117, 140, 0.25) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "سكينة الروح 🕊️",
        message: "في كل مرة أتحدث فيها معكِ أجد ذلك الأمان الفطري الذي لا يكرره أحد، وكأن الدنيا بأسرها تبتسم حين تكونين بخير وراحة بال.",
        buttonSticker: "🕊️",
        rainSticker: ["🕊️", "🌸", "✨"],
        glow: "radial-gradient(circle, rgba(168, 203, 230, 0.22) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "حديث الليل 🌙",
        message: "كل كلمة صادقة منكِ تترك دفئاً بقلبي. وجودكِ يمنح أيامي طعماً ورُقياً مختلفاً لا يستطيع أحد أن يمنحني إياه سواكِ.",
        buttonSticker: "🌙",
        rainSticker: ["🌙", "⭐", "✨"],
        glow: "radial-gradient(circle, rgba(186, 147, 219, 0.25) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "نقاء ونبل 🖤",
        message: "أتأمل دائماً نقاء روحكِ ولطف التعامل بفي تفاصيلكِ، وأدرك تماماً كم أنكِ انسانة استثنائية تستحق كل الحب والتقدير والاحترام.",
        buttonSticker: "🖤",
        rainSticker: ["🖤", "💭", "✨"],
        glow: "radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "تفاصيل صغيرة ☕",
        message: "التفاصيل البسيطة معكِ هي الأكثر بقاءً في ذاكرتي.. ابتسامتكِ، صوتكِ، واهتمامكِ اللطيف الذي يصنع يومي برقة.",
        buttonSticker: "☕",
        rainSticker: ["☕", "🍂", "🍁"],
        glow: "radial-gradient(circle, rgba(230, 180, 150, 0.2) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "مكانة لا تتغير 🗝️",
        message: "لكِ في قلبي مكانٌ لا يصله غيركِ أبداً، مكان صُنع من تقدير عميق وحبٍ ثابت تشهد عليه الأيام والسنوات.",
        buttonSticker: "🗝️",
        rainSticker: ["🗝️", "💎", "✨"],
        glow: "radial-gradient(circle, rgba(219, 112, 147, 0.25) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "عَهدٌ وصُدق 📜",
        message: "أن أكون لكِ دائماً ذلك السند الحقيقي والأمان الذي تلجئين إليه بثقة ودون تردد، وأن تبقي دائماً الأهم في نظري.",
        buttonSticker: "📜",
        rainSticker: ["📜", "✒️", "💌"],
        glow: "radial-gradient(circle, rgba(160, 210, 205, 0.22) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "ضي الأيام 🕯️",
        message: "مهما كانت الظروف متعبة، تبقى ذكراكِ ووجودكِ كالضوء الهادئ النقي الذي ينير الطريق ويمنح القوة.",
        buttonSticker: "🕯️",
        rainSticker: ["🕯️", "✨", "🌸"],
        glow: "radial-gradient(circle, rgba(240, 190, 120, 0.2) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "عمق الشعور 💍",
        message: "الحب الصادق يتجسد بفي ذلك الأمان العميق الذي تشعرين به بفي صدركِ دون حاجة للمزيد من التبرير والتفسير.",
        buttonSticker: "💍",
        rainSticker: ["💍", "💎", "💖"],
        glow: "radial-gradient(circle, rgba(200, 150, 180, 0.25) 0%, rgba(13, 10, 20, 0) 70%)"
      },
      {
        title: "دائماً وأبداً ❤️",
        message: "شكراً لأنكِ بفي حياتي بكل جمالكِ ونقائكِ. دمتِ أثمن وأجمل نِعمة يا اموشاتي.. معكِ وعنكِ ولأجلكِ دائماً. — علي",
        buttonSticker: "❤️",
        rainSticker: ["❤️", "💖", "✨"],
        glow: "radial-gradient(circle, rgba(255, 105, 180, 0.35) 0%, rgba(13, 10, 20, 0) 70%)"
      }
    ];

    let current = 0;

    // بناء نقط مؤشر الصفحات
    function setupDots() {
      const container = document.getElementById('dotsContainer');
      container.innerHTML = '';
      pages.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        container.appendChild(dot);
      });
    }

    function renderPage() {
      const p = pages[current];
      
      // التغيير مع أنيميشن ناعم للنص
      const textBlock = document.getElementById('textBlock');
      textBlock.style.animation = 'none';
      textBlock.offsetHeight;
      textBlock.style.animation = 'fadeInText 0.8s ease-in-out';

      document.getElementById('title').innerText = p.title;
      document.getElementById('message').innerText = p.message;
      document.getElementById('btnSticker').innerText = p.buttonSticker;
      document.getElementById('glow').style.background = p.glow;

      // تحديث نقاط التقدم
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.className = `dot ${idx === current ? 'active' : ''}`;
      });

      // إذا وصلنا آخر صفحة يختفي الزر
      if (current === pages.length - 1) {
        document.getElementById('btnHint').innerText = "النهاية ❤️";
      }
    }

    function nextPage() {
      if (current < pages.length - 1) {
        current++;
        renderPage();
      }
    }

    // تساقط الستيكرات بأسلوب مطر متحرك يتغير كل صفحة
    function spawnRainSticker() {
      const p = pages[current];
      const sticker = document.createElement('div');
      sticker.className = 'falling-sticker';
      
      // اختيار ستيكر عشوائي من ستيكرات الصفحة الحالية
      const randomIcon = p.rainSticker[Math.floor(Math.random() * p.rainSticker.length)];
      sticker.innerText = randomIcon;
      
      sticker.style.left = Math.random() * 90 + 5 + 'vw';
      sticker.style.fontSize = Math.random() * 15 + 20 + 'px';
      sticker.style.animationDuration = Math.random() * 3 + 4 + 's';
      
      document.body.appendChild(sticker);

      setTimeout(() => sticker.remove(), 7000);
    }

    setupDots();
    renderPage();
    setInterval(spawnRainSticker, 500);
  </script>

</body>
</html>
