<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>علي & اموشاتي ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background 0.8s ease;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
    }

    /* خلفية قلوب متساقطة */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .heart-particle {
      position: absolute;
      bottom: -10px;
      font-size: 20px;
      animation: floatUp 5s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
      100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
    }

    /* Container Card */
    .card-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 420px;
      min-height: 540px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 35px;
      padding: 35px 25px 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .sticker-box {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
      margin-bottom: 15px;
      animation: pulseSticker 2.5s infinite ease-in-out;
    }

    .sticker-box img {
      width: 95px;
      height: 95px;
    }

    @keyframes pulseSticker {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      color: #2c2c2c;
      margin-bottom: 12px;
      font-family: 'Reem Kufi', sans-serif;
    }

    .message {
      font-size: 16px;
      line-height: 1.8;
      color: #333;
      font-weight: 700;
      margin-bottom: 20px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
    }

    /* Buttons Navigation */
    .nav-buttons {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #ffffff;
      color: #d63384;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }

    button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      background: #fff0f5;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .indicator {
      font-size: 13px;
      color: #444;
      font-weight: 800;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- القلوب المتساقطة -->
  <div class="bg-hearts" id="heartsContainer"></div>

  <!-- البطاقة الرئيسية -->
  <div class="card-container" id="card">
    <div class="sticker-box">
      <img id="sticker" src="" alt="ملصق بناتي">
    </div>

    <div>
      <h2 class="title" id="title">عنوان الصفحة</h2>
      <p class="message" id="message">محتوى الرسالة...</p>
    </div>

    <div style="width: 100%;">
      <div class="nav-buttons">
        <button id="prevBtn" onclick="prevPage()">السابق 👈</button>
        <button id="nextBtn" onclick="nextPage()">التالي 👉</button>
      </div>
      <div class="indicator" id="indicator">1 / 5</div>
    </div>
  </div>

  <script>
    // بيانات الصفحات والمحتوى
    const pages = [
      {
        bg: "linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%)",
        sticker: "https://api.iconify.design/fluent-emoji:sparkling-heart.svg",
        title: "إلى أميرة قلبي اموشاتي 👑❤️",
        message: "هذا الموقع الصغير صممته الج خصيصاً حتى أذكرج شكد إنتي غالية ومميزة بحياتي.. من حبيبتج وعمرج علي ✨"
      },
      {
        bg: "linear-gradient(135deg, #a8edda 0%, #fed6e3 100%)",
        sticker: "https://api.iconify.design/fluent-emoji:girl-light.svg",
        title: "ضحكتج وعيونج الحلوة 🌸",
        message: "تدرين يا اموشاتي إنو ابتسامتج هي أحلى شمس تشرق بيومي؟ كل ما أذكرج تبتسم الدنيا كلها بعيوني 💕"
      },
      {
        bg: "linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)",
        sticker: "https://api.iconify.design/fluent-emoji:revolving-hearts.svg",
        title: "مكانج بقلبي 💖",
        message: "إنتي مو بس حبيبتي، إنتي ألطف وأجمل شيء صار بحياتي.. ربي يديمج لي يا أحلى نعم رب العالمين ✨"
      },
      {
        bg: "linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)",
        sticker: "https://api.iconify.design/fluent-emoji:growing-heart.svg",
        title: "وعد علي 💍",
        message: "أوعدج أظل دائماً سندج وأحمي ضحكتج الحلوة، وأحبج أكثر وأكثر بكل يوم يمر علينا.. حبة علي لاموشاتي ما ينتهي 🌱"
      },
      {
        bg: "linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)",
        sticker: "https://api.iconify.design/fluent-emoji:love-letter.svg",
        title: "احبج هواي هواي ❤️",
        message: "شكراً لأنكِ بفي حياتي، وشكراً على كل فرحة تصنعيها بوجودج اللطيف.. يموت عليج حبيبتج علي! 🧸✨"
      }
    ];

    let currentPage = 0;

    function updatePage() {
      const p = pages[currentPage];
      document.body.style.background = p.bg;
      document.getElementById('sticker').src = p.sticker;
      document.getElementById('title').innerText = p.title;
      document.getElementById('message').innerText = p.message;
      document.getElementById('indicator').innerText = `${currentPage + 1} / ${pages.length}`;

      document.getElementById('prevBtn').disabled = (currentPage === 0);
      document.getElementById('nextBtn').disabled = (currentPage === pages.length - 1);
    }

    function nextPage() {
      if (currentPage < pages.length - 1) {
        currentPage++;
        updatePage();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        updatePage();
      }
    }

    // توليد القلوب المتساقطة بالخلفية
    function createHearts() {
      const container = document.getElementById('heartsContainer');
      const hearts = ['❤️', '💖', '💕', '🌸', '✨'];
      
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart-particle');
        heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
        container.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 6000);
      }, 400);
    }

    updatePage();
    createHearts();
  </script>
</body>
</html>
