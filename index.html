<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلى اموشاتي | من علي ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0c1b;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      color: #fff;
      position: relative;
    }

    /* خلفية متدرجة مع أضواء ناعمة */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(219, 112, 147, 0.25) 0%, rgba(15, 12, 27, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(50px);
      z-index: 1;
      animation: pulseGlow 8s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
    }

    /* القلوب والجزيئات المتساقطة الراقية */
    .floating-element {
      position: absolute;
      top: -40px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.6;
      animation: floatDown linear forwards;
    }

    @keyframes floatDown {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
      100% { transform: translateY(105vh) rotate(180deg); opacity: 0; }
    }

    /* البطاقة الرئيسية */
    .main-card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 440px;
      min-height: 580px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 35px 28px 25px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      transition: all 0.5s ease;
    }

    /* الرمز التعبيري / الستيكر الراقي */
    .icon-wrapper {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
      animation: gentleFloat 4s infinite ease-in-out;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* العناوين والنصوص */
    .title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 26px;
      font-weight: 700;
      color: #f7d6e0;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(247, 214, 224, 0.2);
    }

    .content-box {
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
    }

    .message {
      font-size: 16px;
      line-height: 1.9;
      color: #e0e0e0;
      font-weight: 300;
    }

    /* تحكم الأزرار والمؤشر */
    .bottom-section {
      width: 100%;
      margin-top: 20px;
    }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 13px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Tajawal', sans-serif;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff758c, #ff7eb3);
      width: 10%;
      transition: width 0.4s ease;
    }

    .page-number {
      font-size: 12px;
      color: #a0a0a0;
      margin-top: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="bg-glow" id="glow"></div>

  <div class="main-card">
    <div class="icon-wrapper" id="icon">🥀</div>

    <div>
      <h2 class="title" id="title">عنوان الصفحة</h2>
      <div class="content-box">
        <p class="message" id="message">جاري التحميل...</p>
      </div>
    </div>

    <div class="bottom-section">
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="controls">
        <button class="btn" id="prevBtn" onclick="prev()">السابق</button>
        <button class="btn" id="nextBtn" onclick="next()">التالي</button>
      </div>
      <div class="page-number" id="pageIndicator">01 / 10</div>
    </div>
  </div>

  <script>
    // 10 صفحات نصوص راقية وهادئة بعيدة عن الأسلوب الطفولي
    const pages = [
      {
        icon: "🥀",
        title: "إلى اموشاتي..",
        text: "لم تكي يوماً مجرد شخص مرّ بفي حياتي، بل كنتِ الهدوء الذي تمنيته وسط كل هذا العالم المزدحم. هذه السطور صممتها لكِ بحب صادق.. من علي.",
        glow: "radial-gradient(circle, rgba(219, 112, 147, 0.25) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "✨"
      },
      {
        icon: "🕊️",
        title: "سكينة الروح",
        text: "في حضوركِ أجد ذلك الشعور بالاطمئنان الذي لا يتكرر، وكأن الحياة بأسرها تبتسم لي حين تكونين بخير وصحة وراحة بال.",
        glow: "radial-gradient(circle, rgba(168, 203, 230, 0.2) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "🌸"
      },
      {
        icon: "🌙",
        title: "حديث الليل",
        text: "كل كلمة منكِ تترك أثراً دافئاً في قلبي. وجودكِ يمنح الأيام طعماً آخر، أكثر هدوءاً وجمالاً ورُقياً.",
        glow: "radial-gradient(circle, rgba(186, 147, 219, 0.22) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "🌙"
      },
      {
        icon: "🤍",
        title: "نقاء القلب",
        text: "أتأمل دائماً نقاء روحكِ ولطفكِ، وأدرك في كل مرة كم أنكِ جوهرة حقيقية تستحق كل الحب والتقدير والاحترام.",
        glow: "radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "🤍"
      },
      {
        icon: "☕",
        title: "تفاصيل صغيرة",
        text: "التفاصيل البسيطة معكِ هي الأكثر بقاءً بفي ذاكرتي.. ابتسامتكِ، صوتكِ، واهتمامكِ اللطيف الذي يصنع كل الفرق.",
        glow: "radial-gradient(circle, rgba(230, 180, 150, 0.2) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "🍂"
      },
      {
        icon: "🗝️",
        title: "مكانة استثنائية",
        text: "لكِ في قلبي مكانٌ لا يصله أحدٌ غيركِ، مكان صُنِع من تقديرٍ عميق وحبٍ ثابت لا تتغيره الأيام ولا الأوقات.",
        glow: "radial-gradient(circle, rgba(219, 112, 147, 0.25) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "🗝️"
      },
      {
        icon: "📜",
        title: "وعدٌ وصُدق",
        text: "أن أكون لكِ دائماً ذلك السند الحقيقي والأمان الذي تلجئين إليه بثقة، وأن تبقي دائماً الأهم في نظري.",
        glow: "radial-gradient(circle, rgba(160, 210, 205, 0.2) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "💎"
      },
      {
        icon: "🕯️",
        title: "دفء الأيام",
        text: "مهما كانت الحياة قاسية، تبقى ذكراكِ ووجودكِ كالضوء الهادئ الذي ينير كل الطرقات المظلمة.",
        glow: "radial-gradient(circle, rgba(240, 190, 120, 0.2) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "✨"
      },
      {
        icon: "🖤",
        title: "عمق الشعور",
        text: "الحب الحقيقي ليس كثرة الكلام، بل هو ذلك الأمان الذي تشعرين به بعمق دون حاجة للتفسير.",
        glow: "radial-gradient(circle, rgba(200, 150, 180, 0.2) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "🥀"
      },
      {
        icon: "💍",
        title: "دائماً وأبداً",
        text: "شكراً لأنكِ أنتِ بكل روعتكِ. دمتِ لقلبي أثمن وأجمل نِعمة يا اموشاتي.. معكِ وعنكِ ولأجلكِ دائماً. — علي",
        glow: "radial-gradient(circle, rgba(255, 120, 150, 0.3) 0%, rgba(15, 12, 27, 0) 70%)",
        rain: "❤️"
      }
    ];

    let current = 0;

    function render() {
      const data = pages[current];
      document.getElementById('glow').style.background = data.glow;
      document.getElementById('icon').innerText = data.icon;
      document.getElementById('title').innerText = data.title;
      document.getElementById('message').innerText = data.text;

      // تحديث المؤشر والتقدم
      const pageFormatted = (current + 1 < 10 ? '0' : '') + (current + 1);
      document.getElementById('pageIndicator').innerText = `${pageFormatted} / 10`;
      document.getElementById('progress').style.width = `${((current + 1) / pages.length) * 100}%`;

      // حالة الأزرار
      document.getElementById('prevBtn').disabled = (current === 0);
      document.getElementById('nextBtn').disabled = (current === pages.length - 1);
    }

    function next() {
      if (current < pages.length - 1) {
        current++;
        render();
      }
    }

    function prev() {
      if (current > 0) {
        current--;
        render();
      }
    }

    // تساقط العناصر الناعمة بالخلفية
    function createParticles() {
      const el = document.createElement('div');
      el.className = 'floating-element';
      el.innerText = pages[current].rain;
      el.style.left = Math.random() * 90 + 5 + 'vw';
      el.style.fontSize = Math.random() * 10 + 16 + 'px';
      el.style.animationDuration = Math.random() * 3 + 5 + 's';
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 8000);
    }

    setInterval(createParticles, 600);
    render();
  </script>

</body>
</html>
